<!doctype html><meta charset="utf-8">
<style>
body{margin:0;background:transparent;font-family:-apple-system,"PingFang SC",sans-serif}
.row{display:flex;gap:16px;padding:16px}
.card{border-radius:16px;overflow:hidden;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.12)}
.island{width:420px;height:230px;background:linear-gradient(160deg,#27324d,#40304f 55%,#57384a)}
.island .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:170px;height:30px;background:#000;border-radius:0 0 14px 14px}
.island img{position:absolute;top:0;left:50%;transform:translateX(-50%);width:340px}
.kb{width:420px;height:230px;background:linear-gradient(160deg,#3b5a7a,#5b4f7d 55%,#7a5470);display:flex;align-items:center;justify-content:center}
.kb img{width:254px;border-radius:14px;opacity:.94;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.label{position:absolute;left:18px;bottom:14px;color:#fff;font-size:15px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.4)}
</style>
<div class="row">
 <div class="card island"><div class="notch"></div><img src="../island-active.png"><div class="label">刘海灵动岛</div></div>
 <div class="card kb"><img src="../keyboard-lock.png"><div class="label">清洁键盘</div></div>
</div>
